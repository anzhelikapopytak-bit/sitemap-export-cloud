name: Sitemap export

on:
  workflow_dispatch:
  schedule:
    # Every day at 03:17 UTC.
    - cron: "17 3 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      HEADLESS: "false"
      AUTOMATIC_CHALLENGE_WAIT_SECONDS: "35"
      REQUEST_TIMEOUT_SECONDS: "60"
      BROWSER_TIMEOUT_SECONDS: "120"
      MAX_DEPTH: "12"
      MAX_SITEMAPS_PER_ROOT: "5000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium and Linux dependencies
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Export all sitemaps
        run: |
          xvfb-run -a python sitemap_export.py

      - name: Upload CSV and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
